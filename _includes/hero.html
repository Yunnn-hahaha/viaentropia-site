<header class="site-header">
  <div class="header-inner">
    <img 
      src="{{ '/assets/images/viaEntropia_logo_BrezOzadja-1-150x150.png' | relative_url }}" 
      alt="viaEntropia logo" 
      class="logo-small"
    >
    <span class="site-name">viaEntropia</span>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">

    <p class="tagline">Irish punk &amp; whiskey rock</p>
    <p class="subline">viaEntropia – band iz Ljubljane</p>

    <img
      src="{{ '/assets/images/viaEntropia_ekipa_ozadje1-2.png' | relative_url }}"
      alt="viaEntropia band"
      class="band-photo"
    >

  </div>
</section>

<div class="poem">
  <div class="poem-inner">
    <p>Pozor! prihaja viaEntropia!</p>
    <p>Skrijte vse, ker spet bo polomija.</p>
    <p>Folku zna se strgat nenormalno</p>
    <p>in potem se vede nemoralno:</p>
    <p>večkrat je za šankom piva zmanjkal,</p>
    <p>flaše, pipo, čisto vse so stankal.</p>
  </div>
</div>
